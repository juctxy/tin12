<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ý kiến</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div id="kq"></div>

    <form action="youropinion.html">
        <input type="submit" name="cmd" value="Quay lại">
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let params = new URLSearchParams(window.location.search);
            let ten = params.get("hoten");
            let yk = params.get("ykien");
            let theloaiList = params.getAll("theloai");
            let theloai = theloaiList.join(", ");

            if (ten) {
                let html = "Cảm ơn bạn " + ten + " đã góp ý!";

                if (yk) {
                    html += "<br><br>Chúng tôi xin ghi nhận ý kiến của bạn như sau:<br>" + yk;
                }

                if (theloai) {
                    html += "<br><br>Thể loại sách cần bổ sung: " + theloai;
                }

                document.getElementById("kq").innerHTML = html;
            } else {
                document.getElementById("kq").innerHTML = "Cảm ơn bạn đã góp ý!";
            }
        });
    </script>
</body>
</html>
