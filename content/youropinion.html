<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Ý kiến</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <form action="thankyou.html">
        
        <h2>Đóng góp ý kiến cho thư viện của nhà trường</h2>
        
        <ol>
            <li>
                <h3>Thông tin người góp ý</h3>
                <label>Họ và tên: 
                    <input type="text" name="hoten" required>
                </label><br><br>
                
                <label>Địa chỉ Email: 
                    <input type="email" name="email" required>
                </label><br><br>
            </li>

            <li>
                <h3>Đóng góp ý kiến</h3>
                <label>
                    Ý kiến đóng góp:<br>
                    <textarea name="ykien" rows="6" cols="40"></textarea>
                </label><br><br>
            </li>
        </ol>

        <h3>Thể loại cần bổ sung thêm sách</h3>
        <input type="checkbox" name="theloai" value="Truyện ngắn"> Truyện ngắn <br>
        <input type="checkbox" name="theloai" value=" Kĩ năng sống"> Kĩ năng sống <br>
        <input type="checkbox" name="theloai" value="Công nghệ thông tin"> Công nghệ thông tin <br>
        <input type="checkbox" name="theloai" value="Truyện tranh"> Truyện tranh <br>
        <input type="checkbox" name="theloai" value="Lịch sử"> Lịch sử <br>

        <br><br>
        
        <input type="submit" name="cmd" value="Góp ý">
        
    </form>

</body>
</html>
